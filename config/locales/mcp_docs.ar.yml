      body: ابحث في عناوين الكتب ونصوصها، أو استكشف مؤلفات عالم والكتب المتصلة بموضوع دراستك.
    - title: اقرأ النص في سياقه
      body: اطلب من مساعدك قراءة المقطع والصفحات المحيطة به قبل شرحه.
    - title: احتفظ بالمرجع
