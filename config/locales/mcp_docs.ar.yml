    capabilities_title: من السؤال إلى المصدر
    clients:
      chatgpt:
        note: استخدم ChatGPT على الويب. يعتمد توفر الإضافة على حسابك وصلاحيات مساحة العمل.
        steps:
        - افتح Plugins في ChatGPT، واختر +، ثم Add custom MCP server.
        - سمِّ الإضافة Aljam3، وأدخل %{endpoint} في Server URL، واختر No authentication.
        - راجع إشعار الاتصال، واختر Create as a plugin، ثم ثبّت الإضافة من إضافاتك الشخصية.
        - ابدأ محادثة Work، واكتب @، واختر Aljam3، ثم اطرح سؤالك.
      claude:
        note: يحتاج أعضاء Team وEnterprise إلى إضافة الموصل من مالك مساحة العمل أولًا. يسمح الحساب المجاني بموصل مخصص واحد.
        steps:
        - افتح Customize ثم Connectors ثم Add custom connector.
        - سمِّ الموصل Aljam3، وأدخل %{endpoint}.
        - إن ظهرت خيارات المصادقة، اختر No sign-in. اترك بيانات الاعتماد وترويسات الطلب فارغة، ثم اختر Add.
        - في المحادثة، افتح + ثم Connectors وفعّل Aljam3.
    connection_note: وصول للقراءة فقط إلى الكتب العامة. لا تحتاج إلى حساب في الجامع أو مفتاح API.
