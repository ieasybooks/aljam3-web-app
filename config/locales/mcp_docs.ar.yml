    description: ابحث في الكتب الإسلامية، واقرأ النصوص في سياقها، وارجع إلى مصادرها مع مساعدك الذكي. اتصل مرة واحدة، ثم اسأل بأسلوبك.
    eyebrow: الجامع للمساعدات الذكية
    get_started: اربط مساعدك الذكي
    heading: اجعل الجامع بين يدي مساعدك الذكي
    limits:
    - يقبل استعلام البحث حتى 500 حرف.
    - تعرض القوائم 10 نتائج افتراضيًا، وحتى 20 نتيجة لكل طلب و100 صفحة نتائج. ضيّق البحث عند بلوغ الحد؛ ولفهرس البحث أيضًا حد للنتائج المتاحة.
    - يصل المقتطف إلى 1,000 حرف. اقرأ صفحة المصدر للاطلاع على السياق الكامل.
    - يعرض نص الصفحة 6,000 حرف افتراضيًا، وحتى 12,000 حرف لكل طلب. يستطيع المساعد متابعة القراءة من موضع الاستكمال.
    - يقبل الخادم 300 طلب في الدقيقة لكل عنوان IP، وحجم طلب حتى 4 ميبيبايت. عند بلوغ حد الطلبات، ينتظر العميل 60 ثانية قبل المحاولة مجددًا.
    - تدعم الروابط العربية والأردية والإنجليزية. لا يترجم ذلك نص الكتاب.
    limits_title: حدود الاستخدام
    nav_label: المساعدات الذكية
    official_docs: دليل الإعداد الرسمي
    prompts:
    - استخدم الجامع للبحث عن نصوص في النية في العبادة. اقرأ الصفحات المحيطة، واشرح النص بأسلوب مبسط، ووثّق اسم الكتاب والمؤلف ورقم الصفحة مع رابط المصدر.
    - ابحث في الجامع عن كتب في أصول الفقه. اعرض مؤلفيها ومكتباتها المصدرية، ثم ساعدني على اختيار مقطع لدراسته مع توثيق المراجع.
    prompts_intro: اذكر الجامع في سؤالك، واطلب مراجع يمكنك فتحها ومراجعتها.
