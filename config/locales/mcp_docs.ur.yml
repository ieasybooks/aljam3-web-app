    - title: حوالہ محفوظ رکھیں
      body: کتاب، مصنف، فائل اور صفحے کی تفصیل کے ساتھ الجامع اور اصل PDF کے براہ راست روابط حاصل کریں۔
    capabilities_title: سوال سے اصل ماخذ تک
    clients:
