        steps:
        - ChatGPT میں Plugins کھولیں، + دبائیں، پھر Add custom MCP server منتخب کریں۔
        - نام Aljam3 رکھیں، Server URL میں %{endpoint} درج کریں اور No authentication منتخب کریں۔
        - اتصال کا نوٹس پڑھیں، Create as a plugin منتخب کریں، پھر اپنے ذاتی پلگ انز سے اسے انسٹال کریں۔
        - Work میں نئی گفتگو شروع کریں، @ لکھ کر Aljam3 منتخب کریں اور اپنا سوال پوچھیں۔
      claude:
        note: Team اور Enterprise میں پہلے مالک کو کنیکٹر شامل کرنا ہوگا۔ مفت اکاؤنٹ میں ایک ذاتی کنیکٹر شامل کیا جا سکتا ہے۔
        steps:
        - Customize، پھر Connectors، پھر Add custom connector کھولیں۔
        - نام Aljam3 رکھیں اور %{endpoint} درج کریں۔
        - اگر پوچھا جائے تو No sign-in منتخب کریں۔ اسناد اور درخواست کے ہیڈر خالی چھوڑیں، پھر Add دبائیں۔
        - گفتگو میں +، پھر Connectors کھول کر Aljam3 فعال کریں۔
    connection_note: عوامی کتابوں تک صرف پڑھنے کی رسائی۔ الجامع کا اکاؤنٹ یا API کلید درکار نہیں۔
