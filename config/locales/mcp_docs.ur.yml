    - صفحے کا متن عموماً 6,000 حروف دیتا ہے، ہر درخواست میں زیادہ سے زیادہ 12,000 حروف۔ معاون اگلے مقام سے باقی متن پڑھ سکتا ہے۔
    - سرور ہر IP سے فی منٹ 300 درخواستیں اور زیادہ سے زیادہ 4 میبی بائٹ کا درخواست متن قبول کرتا ہے۔ حد تک پہنچنے پر دوبارہ کوشش سے پہلے 60 سیکنڈ انتظار کریں۔
    - روابط عربی، اردو اور انگریزی میں دستیاب ہیں۔ اس سے کتاب کے متن کا ترجمہ نہیں ہوتا۔
