    description: Search Islamic books, read passages in context, and follow the references with your AI assistant. Connect once, then ask in your own words.
    eyebrow: Aljam3 for AI assistants
    get_started: Connect your assistant
    heading: Bring Aljam3 to your AI assistant
    limits:
    - Search queries accept up to 500 characters.
    - Lists return 10 items by default, up to 20 per request and 100 result pages. Narrow your search when the limit is reached; the search index also has its own result window.
    - Search excerpts contain up to 1,000 characters. Read the source page for the full context.
    - Page text returns 6,000 characters by default, up to 12,000 per request. Your assistant can follow the continuation offset to read the rest.
    - The server accepts 300 requests per minute per IP and request bodies up to 4 MiB. A rate-limited client should wait 60 seconds before retrying.
    - Links support Arabic, Urdu and English. This does not translate the book text.
