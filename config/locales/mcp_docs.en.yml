    capabilities:
    - title: Find a source
      body: Search book titles and passages, or explore the works of an author and books on a subject.
    - title: Read in context
      body: Ask your assistant to read a passage and its surrounding pages before explaining it.
    - title: Keep the reference
      body: Get the book, author, file and page with a direct link to Aljam3 and the original PDF.
    capabilities_title: From a question to its source
    clients:
      chatgpt:
        note: Use ChatGPT on the web. Access depends on your account and workspace permissions.
        steps:
        - Open ChatGPT Plugins, select +, then Add custom MCP server.
        - Name it Aljam3, enter %{endpoint} as the Server URL, and choose No authentication.
        - Review the connection notice, choose Create as a plugin, and install it from your personal plugins.
        - Start a Work chat, type @, select Aljam3, and ask your question.
      claude:
        note: Team and Enterprise members need an owner to add the connector first. Free accounts allow one custom connector.
        steps:
        - Open Customize → Connectors → Add custom connector.
        - Name it Aljam3 and enter %{endpoint}.
        - If prompted, choose No sign-in. Leave credentials and request headers blank, then select Add.
        - In your chat, open + → Connectors and enable Aljam3.
    connection_note: Read-only access to public books. No Aljam3 account or API key is needed.
